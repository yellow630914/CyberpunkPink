<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>現實戰鬥 Demo</title>
<style>
:root{--bg:#0d0a14;--bg1:#151020;--bg2:#1d1630;--line:#3a2d52;--ink:#efe9f7;--ink2:#b8adc9;--ink3:#8a7f9e;--pink:#ff4fa3;--pinkhi:#ff8fc8;--mint:#5dffb0;--strong:#fff;--tint:#ff4fa312;--zebra:#ffffff07;--font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--mono:Consolas,monospace}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:var(--font)}
</style></head><body>
<!--demo:start-->
<style>
.cd{--hp:#ff3355;--ld:#ff4fa3;--ap:#ffd66b;--apc:#ffd66b;--cv:#4fd8ff;border:1px solid var(--line);background:var(--bg1);padding:14px;margin:18px 0;font-size:13px;line-height:1.5}
.cd *{box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .cd{--hp:#c81e3a;--ld:#c2186b;--ap:#b07a00;--apc:#6b4200;--cv:#0a6f96}}
:root[data-theme="light"] .cd{--hp:#c81e3a;--ld:#c2186b;--ap:#b07a00;--apc:#6b4200;--cv:#0a6f96}
.cd-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cd-top b{color:var(--pinkhi);letter-spacing:2px}.cd-top .sp{flex:1}
.cd-order{display:flex;gap:4px;flex-wrap:wrap}
.cd-chip{padding:1px 7px;border:1px solid var(--line);color:var(--ink3);font-size:12px}
.cd-chip.on{border-color:var(--pink);color:var(--pinkhi)}.cd-chip.e{border-style:dashed}
.cd-scroll{overflow-x:auto}
.cd-field{display:grid;grid-template-columns:repeat(4,1fr) 26px repeat(4,1fr);gap:6px;min-width:760px}
.cd-mid{display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px;writing-mode:vertical-rl;letter-spacing:4px}
.cd-slot{border:1px solid var(--line);background:var(--bg);min-height:196px;padding:6px;display:flex;flex-direction:column;gap:6px;position:relative}
.cd-slot.tg{outline:2px solid var(--mint);cursor:pointer}.cd-slot.tg:hover{background:var(--tint)}
.cd-sh{display:flex;justify-content:space-between;color:var(--ink3);font-size:11px}
.cd-cov{font-size:11px;color:var(--cv)}.cd-cov.c0{color:var(--ink3)}
.cd-bar{height:5px;background:var(--bg2);position:relative}.cd-bar i{position:absolute;inset:0 auto 0 0;display:block}
.cd-u{border:1px solid var(--line);padding:6px;background:var(--bg1);flex:1;display:flex;flex-direction:column;gap:4px}
.cd-u.act{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.cd-u.dn{opacity:.35}
.cd-u.tg{outline:2px solid var(--mint);cursor:pointer}.cd-u.tg:hover{background:var(--tint)}
.cd-nm{font-weight:700;color:var(--strong);display:flex;justify-content:space-between;gap:4px}
.cd-nm small{color:var(--ink3);font-weight:400}
.cd-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.cd-row .cd-bar{flex:1}
.cd-pips{display:flex;gap:2px}.cd-pips i{width:8px;height:8px;border:1px solid var(--ap);display:block}.cd-pips i.f{background:var(--ap)}
.cd-pips.m i{border-color:var(--ink2);border-radius:50%}.cd-pips.m i.f{background:var(--ink2)}
.cd-pips.l i{border-color:var(--ld);transform:rotate(45deg);width:7px;height:7px;margin:0 2px}.cd-pips.l i.f{background:var(--ld)}
.cd-st{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}.cd-st span{font-size:10.5px;padding:0 4px;border:1px solid var(--line);color:var(--pinkhi)}
.cd-act{display:flex;gap:22px;margin:22px 0 14px;align-items:center;position:relative}
.cd-wbox{position:relative;width:236px;height:236px;flex:none;margin:8px 0 8px 12px}
.cd-w{width:100%;height:100%;overflow:visible;display:block;touch-action:manipulation}
.cd-w .hit{fill:transparent;stroke:none}
.cd-w path,.cd-w circle.bg{fill:var(--bg2);stroke:var(--line);stroke-width:1.2}
.cd-w .r-atk path{fill:color-mix(in srgb,var(--hp) 18%,var(--bg2))}
.cd-w .r-res path{fill:color-mix(in srgb,var(--ap) 16%,var(--bg2))}
.cd-w .r-tac path{fill:color-mix(in srgb,var(--cv) 16%,var(--bg2))}
.cd-w .r-skl circle.bg{fill:color-mix(in srgb,var(--mint) 18%,var(--bg2))}
.cd-w g[data-a]{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.cd-w g.hov{transform:scale(1.42)}
@media (prefers-reduced-motion:reduce){.cd-w g[data-a]{transition:none}}
.cd-w g.dis{cursor:not-allowed}.cd-w g.dis text{opacity:.3}
.cd-w g.hov:not(.dis) path,.cd-w g.hov:not(.dis) circle.bg,.cd-w g:focus-visible path,.cd-w g:focus-visible circle.bg{stroke:var(--pink);stroke-width:2.2}
.cd-w g.sel path,.cd-w g.sel circle.bg{stroke:var(--mint);stroke-width:3}
.cd-w text{fill:var(--ink);font-size:21px;font-weight:700;text-anchor:middle;pointer-events:none}
.cd-w text.c{fill:var(--apc);font-size:13px}
.cd-act.off .cd-wbox{pointer-events:none;opacity:.45}
.cd-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cd-tip{position:absolute;z-index:20;max-width:240px;border:1px solid var(--pink);background:var(--bg);padding:7px 10px;font-size:12.5px;color:var(--ink2);pointer-events:none;box-shadow:0 6px 18px #0008}
.cd-tip[hidden]{display:none}.cd-tip b{color:var(--strong);font-size:14px}.cd-tip i{font-style:normal;color:var(--apc);font-weight:700;margin-left:8px}.cd-tip p{margin:3px 0 0}.cd-tip .no{color:var(--hp)}
.cd-skl{border:1px solid var(--line);padding:8px 10px;background:var(--bg);font-size:12.5px;color:var(--ink2);max-width:420px}.cd-skl b{color:var(--mint)}.cd-skl p{margin:4px 0 0}
.cd-btn{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);padding:6px 11px;cursor:pointer;min-height:36px}
.cd-btn:hover:not(:disabled){border-color:var(--pink);color:var(--pinkhi)}
.cd-btn:disabled{opacity:.35;cursor:not-allowed}.cd-btn.sel{border-color:var(--mint);color:var(--mint)}
.cd-btn small{color:var(--ap);margin-left:4px}
.cd-hint{color:var(--ink2);min-height:20px;margin-bottom:8px}
.cd-log{height:170px;overflow-y:auto;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font-size:12.5px;color:var(--ink2)}
.cd-log p{margin:0 0 3px;max-width:none}.cd-log .h{color:var(--pinkhi)}.cd-log .g{color:var(--mint)}.cd-log .r{color:var(--hp)}
.cd-end{padding:12px;border:1px solid var(--pink);color:var(--pinkhi);margin:10px 0;display:none}
.cd-note{color:var(--ink3);font-size:12px;margin-top:8px}
</style>
<div class="cd" id="cdemo">
  <div class="cd-top"><b>現實戰鬥 DEMO</b><span id="cd-round"></span><div class="cd-order" id="cd-order"></div><span class="sp"></span><button class="cd-btn" id="cd-reset">重新開始</button></div>
  <div class="cd-scroll"><div class="cd-field" id="cd-field"></div></div>
  <div class="cd-end" id="cd-end"></div>
  <div class="cd-act" id="cd-act"><div class="cd-tip" id="cd-tip" hidden></div><div class="cd-wbox" id="cd-wbox"></div><div class="cd-side"><button class="cd-btn" data-a="end" id="cd-endbtn">結束回合</button><div class="cd-skl" id="cd-skl" hidden><b>技能清單</b><p>這個 Demo 還沒有技能。正式版這裡列出這個角色裝著的主動技能與姿態，點了才展開，不佔圓環的位置。</p></div></div></div>
  <div class="cd-hint" id="cd-hint"></div>
  <div class="cd-log" id="cd-log" aria-live="polite"></div>
  <div class="cd-note">照已確認的規則：雙方各四格縱深，距離＝我的格數＋對方格數−1；每次攻擊都會照武器的倍率傷到目標那一格的遮蔽（掩體→半掩體→暴露）；前面那格沒有人也沒有遮蔽時，後排連同自己的遮蔽往前補；行動點每回合回 3；彈匣 1～4 格，連射打空彈匣並自帶壓制；神經傷害打感載，過載失去一回合並疊一層餘韻；制伏要在近身。沒有做的：技能、無人機與機甲、快駭、場地效果。數值都是初稿。</div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id), d6=n=>{let s=0;for(let i=0;i<n;i++)s+=1+Math.floor(Math.random()*6);return s}, d20=()=>1+Math.floor(Math.random()*20);
const W={
 rifle:{n:'步槍',dice:4,r:[3,7],mag:3,pen:2,t:'p',long:1,cm:.5},
 shotgun:{n:'霰彈槍',dice:5,far:3,r:[1,3],mag:2,pen:0,t:'p',push:1,cm:1.5},
 pistol:{n:'手槍',dice:3,r:[1,4],mag:2,pen:0,t:'p',cm:.25},
 smg:{n:'衝鋒槍',dice:3,r:[2,5],mag:3,pen:0,t:'p',cm:.5},
 sniper:{n:'狙擊槍',dice:6,r:[5,7],mag:1,pen:4,t:'p',long:1,cm:.25},
 stun:{n:'感官彈槍',dice:3,r:[2,5],mag:2,pen:0,t:'n',cm:0},
 knife:{n:'刀',dice:3,r:[1,1],mag:0,pen:1,t:'p',melee:1,cm:0}
};
const COVN=['暴露','半掩體','掩體'], COVB=[0,2,4], COVD=[0,15,30];
let S;
function unit(side,slot,name,role,o){return Object.assign({side,slot,name,role,hp:o.hp,hpMax:o.hp,armor:o.armor,load:0,loadMax:o.lm,layers:0,layersMax:o.lay,
  ap:o.ap,apMax:o.ap,refl:o.refl,gun:o.gun,mel:o.mel||0,will:o.will||0,tier:o.tier||1,elite:!!o.elite,
  ws:o.ws.map(k=>({k,mag:W[k].mag})),wi:0,aim:false,stun:false,supp:0,watch:false,daze:false,bleed:false,down:false,out:false},{})}
function init(){
 S={round:1,idx:0,busy:false,mode:null,over:false,
  cov:{P:[null,{l:1,d:15},{l:2,d:30},{l:2,d:30},{l:1,d:15}],E:[null,{l:1,d:15},{l:2,d:30},{l:1,d:15},{l:2,d:30}]},
  units:[
   unit('P',1,'前鋒','霰彈・近戰',{hp:48,armor:4,lm:36,lay:3,ap:5,refl:1,gun:3,mel:5,will:2,ws:['shotgun','knife']}),
   unit('P',2,'灌手','神經',{hp:40,armor:3,lm:40,lay:3,ap:6,refl:2,gun:4,will:3,ws:['stun','pistol']}),
   unit('P',3,'槍手','步槍',{hp:44,armor:3,lm:38,lay:3,ap:5,refl:3,gun:5,will:1,ws:['rifle','pistol']}),
   unit('P',4,'狙擊手','狙擊',{hp:38,armor:2,lm:38,lay:3,ap:5,refl:2,gun:5,will:2,ws:['sniper','pistol']}),
   unit('E',1,'打手','雜兵',{hp:32,armor:1,lm:20,lay:1,ap:4,refl:1,gun:2,mel:4,will:0,ws:['knife','pistol']}),
   unit('E',2,'保全','雜兵',{hp:32,armor:2,lm:22,lay:1,ap:4,refl:1,gun:3,will:1,ws:['stun','pistol']}),
   unit('E',3,'保全','雜兵',{hp:34,armor:2,lm:22,lay:1,ap:4,refl:1,gun:3,will:1,ws:['smg']}),
   unit('E',4,'小隊長','精英',{hp:85,armor:3,lm:30,lay:2,ap:5,refl:2,gun:5,will:3,tier:2,elite:true,ws:['rifle','pistol']})
  ],order:[]};
 S.units.forEach((u,i)=>{u.id=i;u.ini=d20()+u.refl});
 S.order=S.units.slice().sort((a,b)=>b.ini-a.ini).map(u=>u.id);
 $('cd-log').innerHTML='';$('cd-end').style.display='none';
 log('戰鬥開始。第一回合所有人從行動點上限開始。','h');
 startTurn();
}
const cur=()=>S.units[S.order[S.idx]], alive=side=>S.units.filter(u=>u.side===side&&!u.down);
const at=(side,slot)=>S.units.find(u=>u.side===side&&u.slot===slot&&!u.down);
const wp=u=>W[u.ws[u.wi].k], foe=s=>s==='P'?'E':'P', dist=(a,b)=>a.slot+b.slot-1;
function log(t,c){const p=document.createElement('p');if(c)p.className=c;p.textContent=t;const L=$('cd-log');L.appendChild(p);L.scrollTop=L.scrollHeight}
const tag=u=>(u.side==='P'?'':'敵・')+u.name;
function dodge(u){return 10+u.refl+COVB[S.cov[u.side][u.slot].l]-u.layers}
function rmod(a,t,w){const d=dist(a,t);let m=0;if(d<w.r[0])m=-2*(w.r[0]-d);if(d>w.r[1])m=-2*(d-w.r[1]);if(w.long&&a.slot===1)m-=4;return m}
function hitChance(a,t,w){const b=(w.melee?a.mel:a.gun)+rmod(a,t,w)+(a.aim?3:0)-(a.supp?2:0)-a.layers;return Math.max(5,Math.min(95,(21-(dodge(t)-b))*5))}
function compact(side){let moved=true;while(moved){moved=false;for(let s=1;s<=3;s++){if(!at(side,s)&&S.cov[side][s].l===0){const back=S.units.filter(u=>u.side===side&&!u.down&&u.slot>s);if(back.length){back.forEach(u=>u.slot--);const c=S.cov[side];for(let k=s;k<4;k++)c[k]=c[k+1];c[4]={l:0,d:0};log((side==='P'?'我方':'敵方')+'後排連同遮蔽往前補位。');moved=true;break}}}}}
function hurtCover(side,slot,dmg){const c=S.cov[side][slot];dmg=Math.round(dmg);if(c.l===0||dmg<=0)return;if(!at(side,slot))dmg*=2;c.d-=dmg;while(c.l>0&&c.d<=0){c.l--;c.d+=COVD[c.l];if(c.l===0)c.d=0;log((side==='P'?'我方':'敵方')+'第 '+slot+' 格的遮蔽被打成'+COVN[c.l]+'。','h')}compact(side)}
function fall(u,how){u.down=true;u.stun=false;log(tag(u)+how,u.side==='P'?'r':'g');compact(u.side);check()}
function neural(t,n){t.load+=n;if(t.load>=t.loadMax){t.load=0;t.layers++;if(t.layers>t.layersMax){fall(t,' 餘韻疊滿後再過載：倒下。')}else{t.stun=true;log(tag(t)+' 過載！失去下一回合，餘韻 '+t.layers+' 層。','h')}}}
function attack(a,t,o){o=o||{};const w=o.w||wp(a),slotW=a.ws[a.wi],n=o.burst?slotW.mag:1;
 if(w.mag){slotW.mag-=n}
 const r=d20(),bonus=(w.melee?a.mel:a.gun)+rmod(a,t,w)+(a.aim?3:0)-(a.supp?2:0)-a.layers,tot=r+bonus,dg=dodge(t),cb=COVB[S.cov[t.side][t.slot].l];
 const aimed=a.aim;a.aim=false;
 let dice=(w.far&&dist(a,t)>2?w.far:w.dice)+(o.burst?n-1:0);
 const hit=r===20||(r!==1&&tot>=dg), crit=hit&&tot-dg>=5;
 let msg=tag(a)+(o.burst?' 用'+w.n+'連射（'+n+' 格）':' 用'+w.n+'攻擊')+' '+tag(t)+'：d20='+r+(bonus>=0?'+':'')+bonus+'='+tot+' 對迴避 '+dg+'，';
 if(!hit){
  log(msg+(r===1?'自然 1，':'')+(r!==1&&cb&&tot>=dg-cb?'被遮蔽擋下。':'沒打中。'));
  if(cb&&w.cm){const cs=t.side,sl=t.slot,dm=d6(dice)*w.cm;log('遮蔽受 '+Math.round(dm)+'（'+w.n+' ×'+w.cm+'）。');hurtCover(cs,sl,dm)}
 }else{
  if(crit)dice++;const wound=r===20||(crit&&aimed);if(wound&&!t.elite&&t.side==='E')dice++;
  const raw=d6(dice);
  if(cb&&w.cm){log('遮蔽受 '+Math.round(raw*w.cm)+'（'+w.n+' ×'+w.cm+'）。');hurtCover(t.side,t.slot,raw*w.cm)}
  if(w.t==='n'){log(msg+(crit?'要害！':'命中，')+'感載 +'+raw+'。');neural(t,raw)}
  else{const dm=Math.max(0,raw-Math.max(0,t.armor-w.pen));t.hp-=dm;log(msg+(r===20?'自然 20！':crit?'要害！':'命中，')+'傷害 '+raw+'，扣護甲後 '+dm+'。');
   if(wound&&(t.elite||t.side==='P')&&t.hp>0){if(Math.random()<.5){t.bleed=true;log(tag(t)+' 重創（軀幹）：流血。','h')}else{t.daze=true;log(tag(t)+' 重創（頭）：暈眩，下回合行動點 −2。','h')}}
   if(t.hp<=0){t.hp=0;fall(t,t.side==='E'?' 被打倒。':' 倒下。')}
   else if(w.push&&t.slot<4){const b=at(t.side,t.slot+1),os=t.slot;if(b)b.slot=os;t.slot=os+1;log(tag(t)+' 被轟退一格。');compact(t.side)}}
 }
 if(o.burst&&!t.down){const sv=d20()+t.will,dc=10+n*2;if(sv<dc){t.supp=1;log(tag(t)+' 被壓制（定力 '+sv+' 對 '+dc+'）：不能換位、攻擊 −2。','h')}else log(tag(t)+' 撐住了壓制（定力 '+sv+' 對 '+dc+'）。')}
}
function check(){if(S.over)return;const p=alive('P').length,e=alive('E').length;if(!p||!e){S.over=true;const el=$('cd-end');el.style.display='block';el.textContent=e?'全隊倒下：戰敗。在正式的遊戲裡，這裡會進入戰敗事件（依贏的是誰）。':'敵人全部倒下或被制伏：勝利。';log(e?'戰敗。':'勝利。','h')}}
function startTurn(){if(S.over){render();return}const u=cur();
 if(u.down){return next()}
 if(S.round>1){u.ap=Math.min(u.apMax,u.ap+3)}
 if(u.daze){u.ap=Math.max(0,u.ap-2);u.daze=false}
 if(u.bleed){u.hp-=2;log(tag(u)+' 流血 −2。');if(u.hp<=0){u.hp=0;fall(u,' 失血倒下。');if(S.over){render();return}return next()}}
 u.watch=false;
 if(u.stun){u.stun=false;log(tag(u)+' 還在過載中，失去這一回合。');render();return setTimeout(next,500)}
 S.mode=null;render();
 if(u.side==='E'){S.busy=true;hint('');setTimeout(()=>ai(u,0),550)}else{S.busy=false;hint('輪到 '+u.name+'。選一個行動。')}
}
function next(){const u=cur();if(u&&u.supp>0)u.supp--;S.idx++;if(S.idx>=S.order.length){S.idx=0;S.round++;log('—— 第 '+S.round+' 回合 ——','h')}startTurn()}
function hint(t){$('cd-hint').textContent=t}
function watchers(mover){S.units.filter(u=>u.side!==mover.side&&!u.down&&u.watch&&u.ap>=2).forEach(u=>{const w=wp(u),s=u.ws[u.wi];if(mover.down)return;if(w.melee?dist(u,mover)!==1:s.mag<1)return;u.ap-=2;u.watch=false;log(tag(u)+' 待命觸發！','h');attack(u,mover)})}
function move(u,to){const o=at(u.side,to),from=u.slot;if(o)o.slot=from;u.slot=to;log(tag(u)+(o?' 和 '+o.name+' 換位。':' 移到第 '+to+' 格。'));compact(u.side);watchers(u)}
function canMove(u,to){if(to<1||to>4||u.supp)return false;if(at(u.side,to))return true;if(to>u.slot)return S.cov[u.side][u.slot].l>0;return true}
function canSubdue(a,t){return a.slot===1&&t.slot===1&&t.stun&&!t.down&&(!(t.elite||t.side==='P')||t.layers>=t.layersMax)}
function subdue(a,t){const r=d20()+a.mel,dc=10+t.tier*2;if(r>=dc){t.out=true;fall(t,' 被制伏，退出戰鬥（格鬥 '+r+' 對 '+dc+'）。')}else log(tag(a)+' 想制伏 '+tag(t)+'，沒壓住（格鬥 '+r+' 對 '+dc+'）。')}
/* ---- 敵人 AI ---- */
function ai(u,n){if(S.over||u.down||n>6||u.ap<=0){S.busy=false;return next()}
 const foes=alive('P'),w=wp(u),s=u.ws[u.wi];let did=false;
 const sub=foes.find(t=>canSubdue(u,t));
 if(sub&&u.ap>=2){u.ap-=2;subdue(u,sub);did=true}
 else if(w.melee){const t=foes.find(t=>dist(u,t)===1);
  if(t&&u.ap>=2){u.ap-=2;attack(u,t);did=true}
  else if(!t&&u.ws.length>1&&u.ap>=1){u.ap--;u.wi=1;log(tag(u)+' 換成'+wp(u).n+'。');did=true}}
 else if(s.mag<1){if(u.ap>=1){u.ap--;s.mag=w.mag;log(tag(u)+' 換彈。');did=true}}
 else{const t=foes.slice().sort((a,b)=>hitChance(u,b,w)-hitChance(u,a,w)||a.hp-b.hp)[0];
  if(u.slot===1&&u.ws.some(x=>W[x.k].melee)&&foes.some(t=>dist(u,t)===1)&&u.ap>=1&&!w.melee){u.ap--;u.wi=u.ws.findIndex(x=>W[x.k].melee);log(tag(u)+' 換成'+wp(u).n+'。');did=true}
  else if(u.ap>=3&&s.mag>=2&&Math.random()<.35){u.ap-=3;attack(u,t,{burst:true});did=true}
  else if(u.ap>=2){u.ap-=2;attack(u,t);did=true}
  else if(u.ap===1&&!u.aim){u.ap--;u.aim=true;log(tag(u)+' 瞄準。');did=true}}
 render();if(!did||S.over){S.busy=false;return S.over?null:next()}
 setTimeout(()=>ai(u,n+1),650)
}
/* ---- 玩家行動 ---- */
const ACTS=[
 {k:'shoot',d:'花彈匣 1 格，朝一個敵人開槍。',w:'手上是近戰武器，或彈匣空了',g:'atk',n:'射擊',c:2,ok:u=>!wp(u).melee&&u.ws[u.wi].mag>=1,tg:'foe'},
 {k:'burst',d:'打空彈匣：傷害骰加顆，並壓制目標。彈匣至少要有 2 格。',w:'彈匣不到 2 格',g:'atk',n:'連射',c:3,ok:u=>!wp(u).melee&&wp(u).mag>=2&&u.ws[u.wi].mag>=2,tg:'foe'},
 {k:'melee',d:'打近身（雙方第 1 格）的敵人。',w:'手上不是近戰武器',g:'atk',n:'近戰',c:2,ok:u=>wp(u).melee,tg:'melee'},
 {k:'aim',d:'下一次射擊 +3；瞄準後打出要害會造成重創。',w:'已經瞄準了',g:'atk',n:'瞄準',c:1,ok:u=>!u.aim},
 {k:'move',d:'和相鄰的隊友交換，或移到相鄰的空格。',w:'沒有可以換的格，或被壓制',g:'tac',n:'換位',c:1,ok:u=>canMove(u,u.slot-1)||canMove(u,u.slot+1),tg:'slot'},
 {k:'reload',d:'把彈匣補滿。',w:'彈匣是滿的，或手上是近戰武器',g:'res',n:'換彈',c:1,ok:u=>wp(u).mag&&u.ws[u.wi].mag<wp(u).mag},
 {k:'swap',d:'換成另一把武器。',w:'只有一把武器',g:'res',n:'換武器',c:1,ok:u=>u.ws.length>1},
 {k:'cover',d:'不打人，直接打敵方一格的遮蔽；倍率加倍。',w:'手上是近戰武器，或彈匣空了',g:'tac',n:'打遮蔽',c:2,ok:u=>!wp(u).melee&&u.ws[u.wi].mag>=1,tg:'ecov'},
 {k:'watch',d:'待命：敵人換位時立刻反擊一次（另花 2 點）。',w:'已經在待命',g:'tac',n:'待命',c:1,ok:u=>!u.watch},
 {k:'subdue',d:'把正在過載的近身敵人綁起來，讓他退出戰鬥。要過格鬥檢定。',w:'沒有可以制伏的目標（要在近身、對方正在過載；精英要餘韻疊滿）',g:'tac',n:'制伏',c:2,ok:u=>alive('E').some(t=>canSubdue(u,t)),tg:'sub'},
 {k:'item',d:'使用快取格裡的道具。',w:'這個 Demo 沒有做',g:'res',n:'道具',c:1,ok:()=>false},
 {k:'flee',d:'全隊檢定，成功就離開這場戰鬥。',w:'這個 Demo 沒有做',g:'tac',n:'脫離',c:2,ok:()=>false},
 {k:'end',g:'end',n:'結束回合',c:0,ok:()=>true}
];
function act(k){if(S.busy||S.over)return;if(k==='skill'){S.skill=!S.skill;return render()}const u=cur(),a=ACTS.find(x=>x.k===k);if(!a)return;if(u.ap<a.c||!a.ok(u))return;
 if(a.tg){S.mode=S.mode===k?null:k;hint(S.mode?({foe:'選一個敵人（綠框）。括號裡是命中率。',melee:'選近身的敵人。',slot:'選要換到哪一格（綠框）。往後退、讓前面空著，前面那一格要有遮蔽。',ecov:'選敵方的一格，打它的遮蔽。沒人站的格子，遮蔽耐久減半。',sub:'選一個正在過載的近身敵人。精英要餘韻疊滿。'})[a.tg]:'');return render()}
 S.mode=null;
 if(k==='aim'){u.ap--;u.aim=true;log(u.name+' 瞄準：下一次射擊 +3。')}
 else if(k==='reload'){u.ap--;u.ws[u.wi].mag=wp(u).mag;log(u.name+' 換彈。')}
 else if(k==='swap'){u.ap--;u.wi=(u.wi+1)%u.ws.length;log(u.name+' 換成'+wp(u).n+'。')}
 else if(k==='watch'){u.ap--;u.watch=true;log(u.name+' 待命：敵人換位時反擊（另花 2 點）。')}
 else if(k==='end'){return next()}
 render()
}
function pick(kind,v){if(S.busy||S.over||!S.mode)return;const u=cur(),k=S.mode;
 if(kind==='unit'){const t=S.units[v];if(t.side==='P'||t.down)return;
  if(k==='shoot'){u.ap-=2;attack(u,t)}else if(k==='burst'){u.ap-=3;attack(u,t,{burst:true})}
  else if(k==='melee'){if(dist(u,t)!==1)return;u.ap-=2;attack(u,t)}
  else if(k==='sub'){if(!canSubdue(u,t))return;u.ap-=2;subdue(u,t)}else return}
 else if(kind==='slot'){const [side,slot]=v;
  if(k==='move'&&side==='P'){if(Math.abs(slot-u.slot)!==1||!canMove(u,slot))return;u.ap--;move(u,slot)}
  else if(k==='cover'&&side==='E'){if(S.cov.E[slot].l===0)return;u.ap-=2;u.ws[u.wi].mag--;const w=wp(u),dm=Math.round(d6(w.dice)*Math.max(1,w.cm*2));log(u.name+' 打敵方第 '+slot+' 格的遮蔽（'+dm+'）。');hurtCover('E',slot,dm)}else return}
 S.mode=null;hint('');render()
}
/* ---- 畫面 ---- */
function bar(v,m,c){return '<div class="cd-bar"><i style="width:'+Math.max(0,Math.min(100,v/m*100))+'%;background:var('+c+')"></i></div>'}
function pips(n,m,cls){let s='<span class="cd-pips '+(cls||'')+'">';for(let i=0;i<m;i++)s+='<i class="'+(i<n?'f':'')+'"></i>';return s+'</span>'}
function render(){const u=cur(),m=S.mode,F=$('cd-field');let h='';
 const col=(side,slot)=>{const c=S.cov[side][slot],x=S.units.find(z=>z.side===side&&z.slot===slot&&!z.down);
  let tg=false;if(m==='move'&&side==='P'&&Math.abs(slot-u.slot)===1&&canMove(u,slot))tg=true;if(m==='cover'&&side==='E'&&c.l>0)tg=true;
  let s='<div class="cd-slot'+(tg?' tg':'')+'" data-s="'+side+slot+'"><div class="cd-sh"><span>'+(side==='P'?'我':'敵')+' '+slot+'</span><span class="cd-cov c'+c.l+'">'+COVN[c.l]+(c.l?' '+Math.max(0,c.d):'')+'</span></div>';
  if(c.l)s+=bar(c.d,COVD[c.l],'--cv');
  if(x){const w=wp(x),ut=m&&x.side==='E'&&((m==='shoot'||m==='burst')||(m==='melee'&&dist(u,x)===1)||(m==='sub'&&canSubdue(u,x)));
   s+='<div class="cd-u'+(x.id===u.id&&!S.over?' act':'')+(ut?' tg':'')+'" data-u="'+x.id+'"><div class="cd-nm"><span>'+x.name+'</span><small>'+x.role+(ut&&m!=='sub'?' '+hitChance(u,x,wp(u))+'%':'')+'</small></div>'
    +'<div class="cd-row">命'+bar(x.hp,x.hpMax,'--hp')+x.hp+'</div>'
    +'<div class="cd-row">感'+bar(x.load,x.loadMax,'--ld')+pips(x.layers,x.layersMax,'l')+'</div>'
    +'<div class="cd-row">行 '+pips(x.ap,x.apMax)+'</div>'
    +'<div class="cd-row">'+w.n+' '+(w.mag?pips(x.ws[x.wi].mag,w.mag,'m'):'')+'</div>'
    +'<div class="cd-st">'+(x.aim?'<span>瞄準</span>':'')+(x.stun?'<span>過載</span>':'')+(x.supp?'<span>被壓制</span>':'')+(x.watch?'<span>待命</span>':'')+(x.bleed?'<span>流血</span>':'')+(x.daze?'<span>暈眩</span>':'')+'</div></div>'}
  return s+'</div>'};
 for(let s=4;s>=1;s--)h+=col('P',s);h+='<div class="cd-mid">近身</div>';for(let s=1;s<=4;s++)h+=col('E',s);F.innerHTML=h;
 $('cd-round').textContent='第 '+S.round+' 回合';
 $('cd-order').innerHTML=S.order.map((id,i)=>{const x=S.units[id];return x.down?'':'<span class="cd-chip'+(i===S.idx?' on':'')+(x.side==='E'?' e':'')+'">'+x.name+'</span>'}).join('');
 const A=$('cd-act');
 updWheel(u,m);
}
const CH={shoot:'射',burst:'連',melee:'近',aim:'瞄',move:'移',reload:'彈',swap:'換',item:'具',cover:'蔽',watch:'待',subdue:'伏',flee:'離'};
(function buildWheel(){const CX=174,CY=174,pt=(r,a)=>{const t=(a-90)*Math.PI/180;return [(CX+r*Math.cos(t)).toFixed(1),(CY+r*Math.sin(t)).toFixed(1)]};
 const arc=(r0,r1,a0,a1)=>{const A0=pt(r1,a0),A1=pt(r1,a1),B1=pt(r0,a1),B0=pt(r0,a0);return 'M'+A0+'A'+r1+' '+r1+' 0 0 1 '+A1+'L'+B1+'A'+r0+' '+r0+' 0 0 0 '+B0+'Z'};
 const ring=(g,r0,r1,off)=>{const L=ACTS.filter(a=>a.g===g),st=360/L.length;return L.map((a,i)=>{const a0=off+i*st+1,a1=off+(i+1)*st-1,c=pt((r0+r1)/2,(a0+a1)/2);
  return '<g class="r-'+g+'" data-a="'+a.k+'" role="button" tabindex="0" aria-label="'+a.n+'，'+a.c+' 點行動點。'+a.d+'"><path d="'+arc(r0,r1,a0,a1)+'"/><text x="'+c[0]+'" y="'+(+c[1]+4)+'">'+CH[a.k]+'</text><text class="c" x="'+c[0]+'" y="'+(+c[1]+18)+'">'+a.c+'</text></g>'}).join('')};
 $('cd-wbox').innerHTML='<svg class="cd-w" viewBox="0 0 348 348" role="group" aria-label="行動圓環"><circle class="hit" cx="174" cy="174" r="173"/>'+ring('tac',128,172,-36)+ring('atk',84,126,-45)+ring('res',42,82,-60)
  +'<g class="r-skl" data-a="skill" role="button" tabindex="0" aria-label="技能清單"><circle class="bg" cx="174" cy="174" r="40"/><text x="174" y="182">技</text></g></svg>';
})();
function tipHTML(k){if(k==='skill')return '<b>技能</b><p>打開技能清單。</p>';const a=ACTS.find(x=>x.k===k),u=cur();if(!a)return '';
 const no=u.side==='P'&&(u.ap<a.c?'行動點不夠':(!a.ok(u)?a.w:''));return '<b>'+a.n+'</b><i>'+a.c+' 點</i><p>'+a.d+'</p>'+(no?'<p class="no">現在做不到：'+no+'。</p>':'')}
function updWheel(u,m){const off=S.over||u.side==='E';$('cd-act').classList.toggle('off',off);$('cd-endbtn').disabled=off;$('cd-endbtn').classList.toggle('dis',off);
 $('cd-wbox').querySelectorAll('g[data-a]').forEach(g=>{const k=g.getAttribute('data-a'),a=ACTS.find(x=>x.k===k);
  const dis=off||(a?(u.ap<a.c||!a.ok(u)):false);g.classList.toggle('dis',dis);g.classList.toggle('sel',k==='skill'?!!S.skill:m===k);g.setAttribute('aria-disabled',dis);g.setAttribute('tabindex',dis?-1:0)});
 $('cd-skl').hidden=!S.skill;if(off)hov(null)}
const WB=$('cd-wbox'),TIP=$('cd-tip'),touch=window.matchMedia&&window.matchMedia('(hover: none)').matches;let HV=null;
function hov(g,x,y){if(HV&&HV!==g)HV.classList.remove('hov');HV=g;if(!g){TIP.hidden=true;return}
 if(!g.classList.contains('hov')){g.parentNode.appendChild(g);g.classList.add('hov')}
 TIP.innerHTML=tipHTML(g.getAttribute('data-a'));TIP.hidden=false;const R=$('cd-act').getBoundingClientRect();
 if(x==null){const b=g.getBoundingClientRect();x=b.right;y=b.top}
 let L=x-R.left+18,T=y-R.top+18;const w=TIP.offsetWidth,h=TIP.offsetHeight;if(L+w>R.width)L=Math.max(0,x-R.left-w-18);if(y+18+h>window.innerHeight)T=y-R.top-h-14;
 TIP.style.left=L+'px';TIP.style.top=T+'px'}
WB.addEventListener('mousemove',e=>{const g=e.target.closest('g[data-a]');if(g)hov(g,e.clientX,e.clientY);else if(HV)hov(HV,e.clientX,e.clientY)});
WB.addEventListener('mouseleave',()=>hov(null));
WB.addEventListener('focusin',e=>{const g=e.target.closest('g[data-a]');if(g)hov(g)});
WB.addEventListener('focusout',()=>hov(null));
$('cd-act').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const inW=WB.contains(b);
 if(touch&&inW&&HV!==b){hov(b);return}
 if(b.classList.contains('dis'))return;act(b.getAttribute('data-a'));if(touch)hov(null)});
document.addEventListener('click',e=>{if(touch&&!WB.contains(e.target))hov(null)});
$('cd-act').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const b=e.target.closest('g[data-a]');if(b&&!b.classList.contains('dis')){e.preventDefault();act(b.getAttribute('data-a'))}});
$('cd-field').addEventListener('click',e=>{const x=e.target.closest('.cd-u.tg');if(x)return pick('unit',+x.dataset.u);const s=e.target.closest('.cd-slot.tg');if(s)pick('slot',[s.dataset.s[0],+s.dataset.s[1]])});
$('cd-reset').addEventListener('click',init);
init();
})();
</script>
